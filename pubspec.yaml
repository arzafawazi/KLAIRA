name: klaira
description: "Klaira — aplikasi deteksi dini overclaim pada iklan skincare untuk mendukung konsumsi yang bertanggung jawab (SDG 12)."
publish_to: 'none'

version: 1.0.0+1

environment:
  # Kompatibel dengan Flutter 3.27 (Dart 3.6) ke atas.
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Navigasi deklaratif + bottom navigation yang mempertahankan state tiap tab.
  go_router: ^14.8.1
  # State management sederhana berbasis ChangeNotifier.
  provider: ^6.1.2
  # Penyimpanan lokal (riwayat, status onboarding, preferensi).
  shared_preferences: ^2.3.3
  # Format tanggal Bahasa Indonesia.
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/images/articles/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
